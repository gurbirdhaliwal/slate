# PR quality gate. The job name (tests) is the required status check in the
# main-branch ruleset — renaming it means updating the ruleset, or merges
# will block forever.

name: ci

on:
  pull_request:
  push:
    branches: [main] # keeps main's checks green post-merge

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # slate anchors freshness to git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Context layer freshness (dogfood)
        # Slate maintains its own context layer. A PR that changes watched
        # code without running `slate sync` fails here — the tool eats its
        # own cooking on every merge.
        run: slate status --ci
