# Merge to main -> dev environment, automatically. Prod is a separate,
# human-gated workflow (deploy-prod.yml) — nothing on this path can reach it:
# the production secrets are scoped to the "production" environment.

name: deploy-dev

on:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: true # only the newest merge needs to land on dev

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/slate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: worker
            context: apps/worker
            dockerfile: apps/worker/Dockerfile
          - name: spa-build
            context: .
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev # VPS_* secrets below are the DEV-scoped ones
    steps:
      - name: Deploy to dev stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/slate-dev
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            docker image prune -f
