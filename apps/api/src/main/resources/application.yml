spring:
  application:
    name: slate-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/slate}
    username: ${POSTGRES_USER:slate}
    password: ${POSTGRES_PASSWORD:slate}
  # Flyway runs on startup against the raw datasource; a failed migration
  # fails the boot loudly (default behavior — do not soften it).
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    root: ${LOG_LEVEL:info}

slate:
  api-key-pepper: ${API_KEY_PEPPER:dev-pepper-change-me}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    ttl-seconds: 43200
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:slate-minio}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me}
    bucket: ${MINIO_BUCKET:slate-payloads}
