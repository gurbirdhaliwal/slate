[project]
name = "slate-worker"
version = "0.1.0"
description = "Slate diagnosis engine workers (Stage 1 step verdicts + Stage 2 fault localization)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
slate-worker = "slate_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_worker"]

[tool.ruff]
line-length = 100
