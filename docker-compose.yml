# Slate — single-VPS deployment (see slate-product-doc.md §7).
# Core services always run; observability stack runs under the "observability" profile:
#   docker compose --profile observability up -d
#
# Postgres and MinIO live on named volumes and are never recreated by a deploy.

name: slate

services:
  nginx:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: ghcr.io/slate/spa-build:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 + certbot volumes are enabled in production — see infra/nginx/README.md
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: apps/api
    image: ghcr.io/slate/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-slate}
      POSTGRES_USER: ${POSTGRES_USER:-slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slate}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set in .env}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slate-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-slate-payloads}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    build:
      context: apps/worker
    image: ghcr.io/slate/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      replicas: 1   # scale via replicas — SKIP LOCKED makes claims safe at any count
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/${POSTGRES_DB:-slate}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slate-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-slate-payloads}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      ANTHROPIC_MAX_CALLS_PER_10S: ${ANTHROPIC_MAX_CALLS_PER_10S:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    # timescaledb-ha bundles TimescaleDB + pgvector on Postgres 16
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slate}
      POSTGRES_DB: ${POSTGRES_DB:-slate}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      - "127.0.0.1:5432:5432"   # local-only; app traffic goes over the compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slate} -d ${POSTGRES_DB:-slate}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slate-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the payload bucket on first boot
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slate-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-slate-payloads}

  # ---------------------------------------------------------------
  # Observability (profile: observability)
  # Uptime Kuma deliberately lives on a separate nano-VPS — see §7.
  # ---------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  loki:
    image: grafana/loki:latest
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:latest
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  glitchtip:
    image: glitchtip/glitchtip:latest
    profiles: [observability]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - glitchtip-db
      - glitchtip-redis

  glitchtip-db:
    image: postgres:16-alpine
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtipdata:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    profiles: [observability]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
  lokidata:
  glitchtipdata:
