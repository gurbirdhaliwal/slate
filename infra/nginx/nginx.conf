# Slate reverse proxy — serves the React SPA build, proxies /v1/* to the Spring API.
# TLS: in production, certbot manages certificates; the 443 server block is added by
# `certbot --nginx` or by uncommenting the block below once certs exist.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # SDKs send batched step graphs — allow reasonably large payloads
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream api {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        # --- API (Spring Boot) ---
        location /v1/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health endpoint (Uptime Kuma + compose healthcheck)
        location = /health {
            proxy_pass http://api;
        }

        # --- React SPA (static build) ---
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Hashed assets can be cached forever
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # server {
    #     listen 443 ssl;
    #     server_name app.slate.io;
    #     ssl_certificate     /etc/letsencrypt/live/app.slate.io/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/app.slate.io/privkey.pem;
    #     ... same locations as above ...
    # }
}
