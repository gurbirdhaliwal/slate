global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot API — enable micrometer-registry-prometheus + actuator to expose this
  - job_name: slate-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  # Python workers — expose via prometheus_client when metrics land
  # - job_name: slate-worker
  #   static_configs:
  #     - targets: ["worker:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
