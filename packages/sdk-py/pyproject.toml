[project]
name = "slate-sdk"
version = "0.1.0"
description = "Slate — step-graph capture for AI agent debugging (open source SDK)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Deliberately zero runtime dependencies: this SDK lives inside customer
# codebases and must never fight their dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate"]

[tool.ruff]
line-length = 100
